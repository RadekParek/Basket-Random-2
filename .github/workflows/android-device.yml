name: Android device smoke test
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Emulator API level
        type: choice
        options: ['26', '35']
        default: '35'
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run build
      - run: bash android/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ inputs.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            APK=$(find build/apk -name '*.apk' | head -1)
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.radekparek.basketrandom/.MainActivity
            sleep 6
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            PID=$(adb shell pidof com.radekparek.basketrandom | tr -d '\r')
            adb logcat -d -v time AndroidRuntime:E chromium:E WebView:E '*:S' > device-logcat.txt
            cat device-logcat.txt
            test -n "$PID"
            ! grep -q 'FATAL EXCEPTION' device-logcat.txt
      - name: Upload device log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-log
          path: device-logcat.txt
          if-no-files-found: ignore
