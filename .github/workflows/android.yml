name: Test and build Android APK
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Browser and touch smoke tests
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium-browser)" npm run test:browser
  apk:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install pinned Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run build
      - name: Build and verify installable APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: bash android/build.sh
      - name: Verify APK structure and alignment
        run: |
          python3 - <<'PY'
          import glob, zipfile
          apk = glob.glob('build/apk/*.apk')[0]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              for entry in ('classes.dex', 'AndroidManifest.xml', 'resources.arsc', 'assets/index.html', 'assets/game.js', 'assets/style.css'):
                  assert entry in names, f'missing {entry}'
              assert z.getinfo('resources.arsc').compress_type == zipfile.ZIP_STORED, 'resources.arsc must be stored uncompressed'
              print(apk, len(names), 'entries; resources.arsc stored')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/apk/*.apk | grep -E 'package:|launchable-activity:'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 build/apk/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: BasketRandom-APK
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Size summary
        run: |
          echo '### Android build' >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/apk/*.apk >> "$GITHUB_STEP_SUMMARY"
          echo 'Without repository signing secrets this APK uses an ephemeral debug key. It is installable, but not an update-compatible store release.' >> "$GITHUB_STEP_SUMMARY"
  device:
    needs: apk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v8
        with:
          name: BasketRandom-APK
          path: build/apk
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then echo '::error::/dev/kvm is unavailable on this runner'; exit 1; fi
      - name: Install and launch on emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            APK=$(find build/apk -name '*.apk' | head -1)
            if ! adb install -r "$APK" > install.txt 2>&1; then
              cat install.txt
              while IFS= read -r line; do echo "::error::$line"; done < install.txt
              exit 1
            fi
            adb logcat -c
            adb shell am start -W -n com.radekparek.basketrandom/.MainActivity > start.txt 2>&1 || true
            cat start.txt
            sleep 6
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            PID=$(adb shell pidof com.radekparek.basketrandom | tr -d '\r')
            adb logcat -d -v time AndroidRuntime:E chromium:E WebView:E '*:S' > device-logcat.txt
            cat device-logcat.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml window.xml >/dev/null 2>&1 || true
            if [ -f window.xml ]; then cat window.xml; fi
            STATUS=0
            if [ -z "$PID" ]; then echo '::error::App process is not running after launch'; STATUS=1; fi
            if grep -q 'FATAL EXCEPTION' device-logcat.txt; then
              echo '::error::Fatal Android exception during launch'
              while IFS= read -r line; do echo "::error::$line"; done < device-logcat.txt
              STATUS=1
            fi
            if [ -f window.xml ] && grep -Eq 'Startup failed|Could not load|WebView crashed' window.xml; then
              echo '::error::Native startup error screen is visible'
              STATUS=1
            fi
            exit "$STATUS"
      - name: Upload device log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-log
          path: |
            device-logcat.txt
            window.xml
            start.txt
            install.txt
          if-no-files-found: ignore
